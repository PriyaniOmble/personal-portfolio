kind = "web"
previewPath = "/"
title = "Personal Portfolio"
description = "A simple, responsive personal portfolio website with a home page, about section, and contact section for presenting a person's work and story."
version = "1.0.0"
id = "artifacts/personal-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20176

[services.development]
run = "pnpm --filter @workspace/personal-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/personal-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20176"
BASE_PATH = "/"
